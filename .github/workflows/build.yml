name: Build & Release

# Every push to master and every pull request is built, and the result is
# uploaded as a downloadable artifact (Actions run page -> Artifacts).
# A release is created only for a version tag (v1.2.3) or the manual
# "Run workflow" button with a version.

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to create, e.g. v0.3.0 or v0.3.0-rc1'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Work out version
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.version || github.ref_name }}"
          # Release tags: v1.2.3, v1.2, v1.2.3-rc1 or v1.2-rc1 (v1.2 is treated as 1.2.0).
          $isRelease = $false
          if ($tag -match '^v(\d+)\.(\d+)(?:\.(\d+))?(-[0-9A-Za-z.-]+)?$') {
            $isRelease = $true
            $patch = if ($Matches[3]) { $Matches[3] } else { '0' }
            $ver = "$($Matches[1]).$($Matches[2]).$patch$($Matches[4])"
          } else {
            $ver = "0.0.0-ci.${{ github.run_number }}"
            if ("${{ github.ref_type }}" -eq 'tag' -or "${{ github.event_name }}" -eq 'workflow_dispatch') {
              throw "'$tag' is not a release version. Use a tag like v0.3.0 or v0.3.0-rc1."
            }
          }
          "PKG_VERSION=$ver"   >> $env:GITHUB_ENV
          "RELEASE_TAG=$tag"   >> $env:GITHUB_ENV
          "IS_RELEASE=$isRelease" >> $env:GITHUB_ENV
          Write-Host "Version $ver (release: $isRelease)"

      - name: Publish (framework-dependent single file)
        shell: pwsh
        run: |
          dotnet publish ClockScreensaver/ClockScreensaver.csproj `
            -c Release -r win-x64 --self-contained false `
            -p:PublishSingleFile=true -p:Version=$env:PKG_VERSION `
            -o publish

      - name: Package
        shell: pwsh
        run: |
          # The screensaver must be one self-sufficient file; fail if publish left anything else.
          $extra = Get-ChildItem publish | Where-Object Name -ne 'ClockScreensaver.exe'
          if ($extra) { $extra | Format-Table Name, Length; throw 'Unexpected files beside ClockScreensaver.exe' }
          New-Item -ItemType Directory -Force package | Out-Null
          Move-Item publish\ClockScreensaver.exe package\ClockScreensaver.scr
          Copy-Item install.ps1, uninstall.ps1, README.md package\
          $hash = (Get-FileHash package\ClockScreensaver.scr -Algorithm SHA256).Hash
          "$hash  ClockScreensaver.scr" | Out-File package\SHA256.txt -Encoding ascii
          Get-ChildItem package | Format-Table Name, Length
          Compress-Archive package\* "ClockScreensaver-$env:PKG_VERSION.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClockScreensaver-${{ env.PKG_VERSION }}
          path: package/

      - name: Create release
        if: env.IS_RELEASE == 'True'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: |
            ClockScreensaver-${{ env.PKG_VERSION }}.zip
            package/ClockScreensaver.scr
            package/SHA256.txt
          generate_release_notes: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
