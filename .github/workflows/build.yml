name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore ClockScreensaver/ClockScreensaver.csproj

      - name: Publish (single-file, self-contained)
        run: |
          dotnet publish ClockScreensaver/ClockScreensaver.csproj `
            -c Release `
            -r win-x64 `
            --self-contained `
            -p:PublishSingleFile=true `
            -o publish

      - name: Rename to .scr
        run: Rename-Item publish\ClockScreensaver.exe ClockScreensaver.scr

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: publish/ClockScreensaver.scr
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
